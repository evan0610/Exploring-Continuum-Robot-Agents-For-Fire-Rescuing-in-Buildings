<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">Continuum rescue system design</title><desc id="desc">Robot observation and task instruction feed scene understanding, action selection and the continuum robot. A feedback connection carries the next observation. Scene memory and rescue planning are proposed extensions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b65432"/></marker></defs><rect width="1080" height="420" fill="#f3f6f5"/><g font-family="Arial,sans-serif"><text x="35" y="40" font-size="12" letter-spacing="2" fill="#647a7f">專案系統設計 / 規劃中的架構</text><g fill="#fff" stroke="#bfcfcd"><rect x="35" y="96" width="200" height="180"/><rect x="300" y="96" width="220" height="180"/><rect x="585" y="96" width="220" height="180"/><rect x="870" y="96" width="175" height="180"/></g><g fill="#183137" font-size="21" font-weight="bold"><text x="55" y="132">觀察</text><text x="320" y="132">理解</text><text x="605" y="132">選擇動作</text><text x="890" y="132">執行</text></g><g fill="#50666b" font-size="16"><text x="55" y="175">機器人影像</text><text x="55" y="204">任務指令</text><text x="320" y="175">目標定位</text><text x="320" y="204">場景解讀</text><text x="605" y="175">前端轉向</text><text x="605" y="204">工具操作順序</text><text x="890" y="175">彎曲 / 推進</text><text x="890" y="204">噴水 / 遞送</text></g><g fill="#8a6651" font-size="12"><text x="320" y="249">圖像理解層</text><text x="605" y="249">連續體動作層</text></g><g stroke="#b65432" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M235 182H287"/><path d="M520 182H572"/><path d="M805 182H857"/><path d="M957 276V322H135V282"/></g><text x="400" y="346" font-size="15" fill="#50666b">利用新觀察調整下一步動作</text><path d="M35 372H1045" stroke="#d3dddb"/><text x="35" y="399" font-size="14" fill="#647a7f">擬擴展功能：場景記憶、空間推理與長程救援規劃。</text></g></svg>