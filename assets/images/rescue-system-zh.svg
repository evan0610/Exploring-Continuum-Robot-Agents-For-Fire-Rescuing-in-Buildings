<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">Continuum rescue system design</title><desc id="desc">Robot observation and task instruction feed scene understanding, action selection and the continuum robot. A feedback connection carries the next observation. Scene memory and rescue planning are proposed extensions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b65432"/></marker></defs><rect width="1080" height="420" fill="#f3f6f5"/><g font-family="Arial,sans-serif"><text x="35" y="40" font-size="12" letter-spacing="2" fill="#647a7f">专案系统设计 / 规划中的架构</text><g fill="#fff" stroke="#bfcfcd"><rect x="35" y="96" width="200" height="180"/><rect x="300" y="96" width="220" height="180"/><rect x="585" y="96" width="220" height="180"/><rect x="870" y="96" width="175" height="180"/></g><g fill="#183137" font-size="21" font-weight="bold"><text x="55" y="132">观察</text><text x="320" y="132">理解</text><text x="605" y="132">选择动作</text><text x="890" y="132">执行</text></g><g fill="#50666b" font-size="16"><text x="55" y="175">机器人影像</text><text x="55" y="204">任务指令</text><text x="320" y="175">目标定位</text><text x="320" y="204">场景解读</text><text x="605" y="175">前端转向</text><text x="605" y="204">工具操作顺序</text><text x="890" y="175">弯曲 / 推进</text><text x="890" y="204">喷水 / 递送</text></g><g fill="#8a6651" font-size="12"><text x="320" y="249">图像理解层</text><text x="605" y="249">连续体动作层</text></g><g stroke="#b65432" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M235 182H287"/><path d="M520 182H572"/><path d="M805 182H857"/><path d="M957 276V322H135V282"/></g><text x="400" y="346" font-size="15" fill="#50666b">利用新观察调整下一步动作</text><path d="M35 372H1045" stroke="#d3dddb"/><text x="35" y="399" font-size="14" fill="#647a7f">拟扩展功能：场景记忆、空间推理与长程救援规划。</text></g></svg>