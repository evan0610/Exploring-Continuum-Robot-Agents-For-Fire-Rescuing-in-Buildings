<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">Continuum rescue system design</title><desc id="desc">Robot observation and task instruction feed scene understanding, action selection and the continuum robot. A feedback connection carries the next observation. Scene memory and rescue planning are proposed extensions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b65432"/></marker></defs><rect width="1080" height="420" fill="#f3f6f5"/><g font-family="Arial,sans-serif"><text x="35" y="40" font-size="12" letter-spacing="2" fill="#647a7f">PROJECT SYSTEM DESIGN / PROPOSED ARCHITECTURE</text><g fill="#fff" stroke="#bfcfcd"><rect x="35" y="96" width="200" height="180"/><rect x="300" y="96" width="220" height="180"/><rect x="585" y="96" width="220" height="180"/><rect x="870" y="96" width="175" height="180"/></g><g fill="#183137" font-size="21" font-weight="bold"><text x="55" y="132">Observe</text><text x="320" y="132">Understand</text><text x="605" y="132">Select action</text><text x="890" y="132">Execute</text></g><g fill="#50666b" font-size="16"><text x="55" y="175">Robot camera</text><text x="55" y="204">Task instruction</text><text x="320" y="175">Target localization</text><text x="320" y="204">Scene interpretation</text><text x="605" y="175">Tip steering</text><text x="605" y="204">Tool sequencing</text><text x="890" y="175">Bend / advance</text><text x="890" y="204">Spray / deliver</text></g><g fill="#8a6651" font-size="12"><text x="320" y="249">IMAGE-UNDERSTANDING LAYER</text><text x="605" y="249">CONTINUUM-ACTION LAYER</text></g><g stroke="#b65432" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M235 182H287"/><path d="M520 182H572"/><path d="M805 182H857"/><path d="M957 276V322H135V282"/></g><text x="400" y="346" font-size="15" fill="#50666b">New observation informs the next action</text><path d="M35 372H1045" stroke="#d3dddb"/><text x="35" y="399" font-size="14" fill="#647a7f">Proposed extensions: scene memory, spatial reasoning, and longer rescue planning.</text></g></svg>